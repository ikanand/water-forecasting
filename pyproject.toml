[project]
name = "water-forecasting"
description = "Day-ahead hourly water demand forecasting on Databricks (end-to-end MLOps demo)"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "mlflow>=2.16,<4",
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "pyarrow>=14",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.8", "statsmodels>=0.14", "pre-commit>=3.6"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["water_forecasting*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]   # exploration notebooks are documentation, not linted code

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM"]
