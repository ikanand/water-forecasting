# Quarterly (1 Jan/Apr/Jul/Oct): copy a recent, contiguous window of PROD silver into this
# environment, rebuild features and retrain, so dev/qa test on realistic, frozen data.
# No-op in prod. The dev/qa principal needs SELECT on ewec_demo_prod.silver only (see README).
resources:
  jobs:
    refresh_from_prod:
      name: water-forecasting-refresh-from-prod
      tags: { project: water_forecasting, job_type: data_refresh }
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 1 1,4,7,10 ?"
        timezone_id: UTC
        pause_status: ${var.refresh_pause_status}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: copy_prod_silver
          environment_key: default
          spark_python_task:
            python_file: ../scripts/08_refresh_from_prod.py
            parameters: ["--root_path", "${workspace.root_path}", "--env", "${bundle.target}"]

        - task_key: rebuild_features
          depends_on: [{ task_key: copy_prod_silver }]
          environment_key: default
          spark_python_task:
            python_file: ../scripts/04_build_features.py
            parameters: ["--root_path", "${workspace.root_path}", "--env", "${bundle.target}", "--mode", "backfill"]

        - task_key: retrain
          depends_on: [{ task_key: rebuild_features }]
          environment_key: default
          spark_python_task:
            python_file: ../scripts/05_train.py
            parameters: ["--root_path", "${workspace.root_path}", "--env", "${bundle.target}",
                         "--job_run_id", "{{job.run_id}}", "--trigger", "refresh"]
