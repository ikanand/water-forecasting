name: CI

# Every pull request into main: lint, unit tests, build the wheel, validate the bundle.
# Fast and cluster-free: the logic modules are pure Python, so no Databricks compute is needed.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv pip install --system -e ".[test]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Unit tests
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Build wheel
        run: uv build --wheel

  validate-bundle:
    # Catches broken YAML / bad variable references / missing permissions before merge, against the real
    # workspace, as the QA principal. Prod is validated by its own principal at deploy time (a target can
    # only be validated by its run_as identity because its dashboard embeds that identity's credentials);
    # tests/test_bundle_config.py guards the prod definition in the unit tests above.
    runs-on: ubuntu-latest
    environment: qa
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate the qa bundle
        run: databricks bundle validate -t qa
