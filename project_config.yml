# Runtime configuration. Shared settings at the top; per-environment overrides under `environments`.
# Scripts load it with ProjectConfig.from_yaml(path, env) where env = ${bundle.target}.

project_name: water_forecasting
# Single site (city-wide aggregate demand) - no zone/DMA dimension. See source.warehouse below.

schemas:
  landing: landing        # raw pull from the source catalog (SCADA meters, weather, calendar)
  bronze: bronze          # raw, append-only, + _ingested_at / _batch_id
  silver: silver          # validated, deduplicated, conformed hourly grid
  gold: gold              # feature table + forecasts
  ml: ml                  # registered models
  monitoring: monitoring  # DQ results, quarantine, accuracy, model selection leaderboard

source:
  mode: warehouse          # warehouse | files  (files = replay your own CSVs from a UC volume)
  files_volume: raw_files  # /Volumes/<catalog>/landing/<files_volume>/*.csv when mode=files
  warehouse:               # mode=warehouse: pull straight from another catalog's raw tables,
    catalog: mlops_dev     # treating it as "the source system" - same real Dubai demand data
    schema: bronze         # feeds dev/qa/prod alike, sliced by each env's history window.
    consumption_table: dubai_water_demand_hourly_raw
    weather_obs_table: dubai_weather_hourly_raw
    weather_fcst_table: dubai_weather_forecast_hourly_raw
    calendar_table: uae_calendar_events_daily_raw

forecast:
  timezone: Asia/Dubai    # local calendar of the source data; "today" and complete days follow it
  issue_hour_utc: 5       # forecasts are issued at 05:00 UTC (09:00 Dubai) for the whole of tomorrow
  horizon_hours: 24
  min_lag_hours: 48       # lags must be >= 48h: at issue time the newest complete day is D-1

model:
  registered_model: water_demand_forecast
  # Every weekly training fits all candidates and keeps the best on a fresh holdout.
  # Evidence for the growth-aware candidates: notebooks/02_modelling.ipynb.
  candidates: [seasonal_naive_168, ridge_fourier, lightgbm, lightgbm_trend, ridge_interactions, blend_ridge_lgbm]
  holdout_days: 28
  ridge_alpha: 1.0
  lgbm_params:
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
    verbose: -1

decisions:
  min_improvement_pct: 1.0      # challenger must beat champion MAPE by >= 1% (relative)
  max_acceptable_mape: 15.0     # never promote a model worse than this, even with no champion
  degradation_factor: 1.25      # retrain when daily MAPE > 1.25 x champion holdout MAPE ...
  degradation_days: 3           # ... for 3 consecutive days
  min_fresh_days: 7             # champion vs challenger only on >= 7 holdout days the champion never trained on

quality:
  demand_min_m3h: 0.0
  demand_max_m3h: 200000.0      # normal range is ~64k-168k m3/h city-wide; catches injected spikes (~236k+)
  temperature_min_c: 0.0
  temperature_max_c: 50.0
  max_missing_hours_pct: 2.0    # blocking: more missing hours than this in a batch stops the pipeline
  max_missing_hours_abs: 3      # ... or more than this many hours, whichever is looser (protects 1-day batches)
  frozen_min_hours: 3           # >= 3 identical consecutive hourly readings = stuck meter -> quarantine

# history_end = where the one-time setup (backfill) stops. The daily job then lands each following
# complete day, one per run, until it reaches yesterday - and from then on runs in real time.
# qa/prod stop at 2026-09-19 (go-live was 2026-09-23), so their first daily runs re-issue the forecasts
# of 2026-09-20..22 and the monitoring tables hold forecast errors for the days before go-live.
# dev is the replay sandbox: after a reset it restarts from 2026-06-30 and every daily run lands one more
# historical day, so fault drills (--params fault=...) can be demonstrated at any time.
environments:
  dev:
    catalog: ewec_demo_dev
    history_start: "2026-01-01"   # small slice: fast iteration
    history_end: "2026-06-30"
  qa:
    catalog: ewec_demo_stage
    history_start: "2024-09-15"   # 2 years: growth-aware models need >= 18 months to behave as in prod
    history_end: "2026-09-19"
  prod:
    catalog: ewec_demo_prod
    history_start: "2024-01-01"   # full history (earliest available in the source data)
    history_end: "2026-09-19"

refresh:                          # quarterly prod -> dev/qa subset copy (see resources/refresh_job.yml)
  source_catalog: ewec_demo_prod
  lookback_days:
    dev: 180
    qa: 730
